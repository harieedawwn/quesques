<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b3df5"><meta name="description" content="Ôn tập Hóa học 11 – Nitrogen, Sulfur: Luyện tập &amp; Thi thử"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="Hóa học 11"><meta name="format-detection" content="telephone=no">
<title>Ôn tập Hóa học 11 – Luyện tập & Thi thử</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4efe4;--surface:#fffdf8;--surface2:#efe9db;--ink:#16131f;--muted:#6a6578;
 --bd:#16131f;--sh:#16131f;--acc:#5b3df5;--acc-ink:#fff;--lime:#c8ff3d;--lime-ink:#16131f;
 --ok:#15803d;--okbg:#d9f7e3;--bad:#e11d48;--badbg:#ffe1e8;--warn:#d97706;--warnbg:#fff0d0;
 --blob1:#c9bdff;--blob2:#ffd1a8;--dot:#16131f22;
 --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --f-head:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
 --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
 --r:20px;--ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=dark]{
 --bg:#0e0d17;--surface:#181626;--surface2:#221f35;--ink:#f3f0ff;--muted:#9d98b5;
 --bd:#4b4672;--sh:#000;--acc:#8b74ff;--acc-ink:#0e0d17;--lime:#c8ff3d;--lime-ink:#10130a;
 --ok:#4ade80;--okbg:#10301e;--bad:#fb7185;--badbg:#3a1420;--warn:#fbbf24;--warnbg:#3a2a0a;
 --blob1:#3a2a90;--blob2:#7a2d3f;--dot:#ffffff14;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;line-height:1.55;font-size:16px;overflow-x:hidden;transition:background .4s,color .4s;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;z-index:-2}
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:float 22s ease-in-out infinite alternate;pointer-events:none}
.blob.b1{background:var(--blob1);top:-18vmax;left:-12vmax}
.blob.b2{background:var(--blob2);bottom:-20vmax;right:-14vmax;animation-delay:-9s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 40px}
.mono{font-family:var(--f-mono)}
/* generic */
.card{background:var(--surface);border:2px solid var(--bd);border-radius:var(--r);box-shadow:6px 6px 0 var(--sh);transition:background .4s,border-color .4s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;border:2px solid var(--bd);background:var(--surface);font-weight:700;box-shadow:3px 3px 0 var(--sh);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .2s;user-select:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn.ico{padding:10px;width:44px;height:44px;border-radius:14px}
svg{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(18px)}}
/* theme icon */
.theme .sun,.theme .moon{transition:transform .5s var(--ease),opacity .3s;position:absolute}
.theme{position:relative}
[data-theme=light] .theme .moon{transform:rotate(-90deg) scale(0);opacity:0}
[data-theme=dark] .theme .sun{transform:rotate(90deg) scale(0);opacity:0}
.tools{display:flex;gap:8px;flex:none}
.snd-pop{position:fixed;z-index:120;width:min(340px,calc(100vw - 20px));padding:14px;display:grid;gap:10px;animation:modal .3s var(--ease) both}
.snd-pop{overflow-y:auto;overscroll-behavior:contain}.snd-pop .sw{padding:11px 14px}.bigico{width:56px;height:56px;border-radius:16px;border:2px solid var(--bd);background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin-bottom:14px;transform:rotate(-6deg)}.bigico svg{width:28px;height:28px}
.vol{display:flex;align-items:center;gap:14px;padding:6px 6px 2px;font-weight:600;font-size:.9rem}
.vol input{flex:1;accent-color:var(--acc);height:28px}
/* home */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--f-head);font-weight:800;font-size:1.2rem}
.logo i{width:44px;height:44px;border-radius:14px;background:var(--lime);color:var(--lime-ink);border:2px solid var(--bd);box-shadow:3px 3px 0 var(--sh);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:1rem;transform:rotate(-6deg)}
.hero>*,.stats>*{min-width:0}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:stretch;margin-bottom:26px}
.hero-main{padding:28px 28px;min-width:0;position:relative;overflow:hidden}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--lime);color:var(--lime-ink);border:2px solid var(--bd);letter-spacing:.04em}
h1{font-family:var(--f-head);font-weight:800;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.01em}
[data-theme=dark] .lead{color:var(--muted);max-width:46ch;overflow-wrap:anywhere}
.stats{display:grid;grid-template-rows:repeat(3,1fr);gap:14px}
.stat{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat b{font-family:var(--f-head);font-size:2rem;line-height:1}
.stat span{color:var(--muted);font-size:.9rem;text-align:right}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;margin-bottom:22px;background:var(--warnbg);animation:viewIn .5s var(--ease) both}
.sec-t{font-family:var(--f-mono);font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
.mode{text-align:left;padding:24px;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .3s}
.mode:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--sh)}
.mode .big{width:56px;height:56px;border-radius:16px;border:2px solid var(--bd);display:grid;place-items:center;font-size:1.6rem;margin-bottom:14px;background:var(--surface2);transition:transform .4s var(--ease),background .3s}
.mode .big svg{width:28px;height:28px}
.mode h3{font-family:var(--f-head);font-size:1.5rem;line-height:1.1;margin-bottom:6px}
.mode p{color:var(--muted);font-size:.95rem}
.mode ul{list-style:none;padding:0;margin-top:12px;display:grid;gap:5px;font-size:.88rem}
.mode li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--acc);margin-right:9px;transform:rotate(45deg)}
.mode .chk{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;background:var(--surface);transform:scale(.6);opacity:.5;transition:all .3s var(--ease)}
.mode .chk svg{width:16px;height:16px;opacity:0;transition:.2s}
.mode.on{background:var(--surface);outline:4px solid var(--acc);outline-offset:-4px}
.mode.on .big{background:var(--acc);color:var(--acc-ink);transform:rotate(-8deg) scale(1.08)}
.mode.on .chk{background:var(--lime);color:var(--lime-ink);transform:scale(1);opacity:1}
.mode.on .chk svg{opacity:1}
.panel{padding:24px;margin-bottom:26px;display:grid;gap:22px}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:2px solid var(--bd);border-radius:16px;background:var(--surface2);text-align:left;width:100%;transition:background .2s}
.sw b{display:block}.sw b svg{vertical-align:-3px;margin-right:8px}.st svg{width:12px;height:12px;vertical-align:-2px}.sw small{color:var(--muted);display:block;line-height:1.35}
.tg{width:52px;height:30px;border-radius:99px;border:2px solid var(--bd);background:var(--surface);position:relative;flex:none;transition:background .3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .35s var(--ease),background .3s}
.sw[aria-checked=true] .tg{background:var(--acc)}
.sw[aria-checked=true] .tg::after{transform:translateX(22px);background:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--bd);background:var(--surface);font-weight:600;font-size:.88rem;transition:all .2s var(--ease)}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.start{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.start .btn{font-size:1.15rem;padding:16px 30px}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* quiz */
.qtop{position:sticky;top:0;z-index:20;margin:0 -18px 18px;padding:12px 18px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:2px solid var(--bd)}
.prog{flex:1;min-width:0}
.prog .lbl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.78rem;font-weight:700;margin-bottom:5px;gap:8px}
.bar{height:14px;border:2px solid var(--bd);border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,color-mix(in srgb,var(--acc) 80%,#fff) 8px 16px);border-radius:99px;transition:width .6s var(--ease)}
.badge{font-family:var(--f-mono);font-weight:700;font-size:.78rem;padding:6px 12px;border-radius:99px;border:2px solid var(--bd);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.badge.prac{background:var(--lime);color:var(--lime-ink)}
.badge.exam{background:var(--acc);color:var(--acc-ink)}
.timer{font-variant-numeric:tabular-nums;background:var(--surface)}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{padding:26px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.qn{font-family:var(--f-head);font-weight:800;font-size:1.05rem;padding:4px 14px;border-radius:99px;background:var(--ink);color:var(--bg)}
.lesson{font-size:.8rem;color:var(--muted);font-weight:600}
.qtext{font-family:var(--f-head);font-weight:600;font-size:clamp(1.15rem,2.6vw,1.5rem);line-height:1.35;margin-bottom:22px;letter-spacing:-.005em}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;padding:14px 16px;border:2px solid var(--bd);border-radius:16px;background:var(--surface);box-shadow:3px 3px 0 var(--sh);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .25s,border-color .25s}
.opts.in .opt{animation:optIn .5s var(--ease) both;animation-delay:calc(var(--i)*70ms + 80ms)}
@keyframes optIn{from{opacity:0;transform:translateX(-18px)}}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--sh)}
.opt:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;border:2px solid var(--bd);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--surface2);transition:all .25s}
.opt .t{flex:1;padding-top:3px;overflow-wrap:anywhere}
.opt .s{width:26px;height:26px;margin-top:4px;flex:none}
.opt .s svg{width:26px;height:26px;stroke-width:3}
.opt.sel{background:var(--warnbg);border-color:var(--acc);box-shadow:3px 3px 0 var(--acc)}
.opt.sel .k{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok);animation:pop .5s var(--ease)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ok .s{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}.opt.bad .s{color:var(--bad)}
.opt.shake{animation:shake .45s}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{margin-top:18px;padding:16px 18px;border-radius:16px;border:2px solid var(--bd);animation:viewIn .4s var(--ease) both}
.fb b{display:block;font-family:var(--f-head);font-size:1.1rem;margin-bottom:4px}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.fb.bad b{color:var(--bad);margin:0}
.fb.info{background:var(--warnbg);border-color:var(--warn)}.fb.info b{color:var(--warn)}
.note{margin-top:8px;font-size:.95rem}.note::before{content:"Ghi chú: ";font-weight:700}
.qactions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;align-items:center}
.flag.on{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.side{position:sticky;top:84px;padding:18px}
.side h4{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.nb{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);background:var(--surface);font-family:var(--f-mono);font-weight:700;font-size:.9rem;position:relative;transition:transform .2s var(--ease),background .2s}
.nb:hover{transform:translateY(-3px) rotate(-3deg)}
.nb.ans{background:var(--acc);color:var(--acc-ink)}
.nb.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.nb.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.nb.cur{outline:3px solid var(--lime);outline-offset:2px;transform:scale(1.1)}
.nb.fl::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--warn);border:2px solid var(--bd)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--bd);margin-right:5px;vertical-align:-1px}
.qbar{position:sticky;bottom:0;margin:18px -18px -40px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:space-between;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--bd);z-index:15}
.qbar .btn{flex:1;max-width:280px}
.slide-l{animation:sl .45s var(--ease) both}.slide-r{animation:sr .45s var(--ease) both}
@keyframes sl{from{opacity:0;transform:translateX(-40px)}}@keyframes sr{from{opacity:0;transform:translateX(40px)}}
/* result */
.rhero{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:30px;margin-bottom:22px}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:200px;height:200px;transform:rotate(-90deg);stroke-width:14;stroke-linecap:round}
.ring .tr{stroke:var(--surface2)}.ring .pg{stroke:var(--acc);stroke-dasharray:553;stroke-dashoffset:553;transition:stroke-dashoffset 1.4s var(--ease)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-head);font-size:3.2rem;line-height:1}
.ring .c span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.rhero h2{font-family:var(--f-head);font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.1;margin-bottom:8px}
.kp{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.kp div{padding:10px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--surface2);min-width:96px}
.kp b{font-family:var(--f-head);font-size:1.5rem;display:block;line-height:1.1}
.kp small{color:var(--muted)}
.kp .g b{color:var(--ok)}.kp .r b{color:var(--bad)}.kp .y b{color:var(--warn)}
.again{padding:22px;margin-bottom:22px;display:grid;gap:16px}
.again .btns{display:flex;flex-wrap:wrap;gap:12px}
.seg{display:inline-flex;border:2px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{padding:9px 16px;font-weight:700;font-size:.9rem;transition:background .2s}
.seg button.on{background:var(--ink);color:var(--bg)}
.rv{display:grid;gap:18px;margin-top:14px}
.rvi{padding:20px;animation:viewIn .45s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.rvi .qtext{font-size:1.1rem;margin-bottom:14px}
.rvi .opt{cursor:default;box-shadow:none;padding:10px 14px}
.rvi .opt:hover{transform:none;box-shadow:none}
.st{font-family:var(--f-mono);font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:99px;border:2px solid var(--bd)}
.st.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.st.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}.st.skip{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.empty{padding:36px;text-align:center;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:100;animation:fade .25s both;backdrop-filter:blur(4px)}
.modal{max-width:440px;width:100%;padding:26px;animation:modal .4s var(--ease) both}
.modal h3{font-family:var(--f-head);font-size:1.5rem;margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:20px}
.modal .btns{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes modal{from{opacity:0;transform:translateY(30px) scale(.94)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.9}}
/* responsive */
@media(max-width:900px){
 .hero,.modes,.rhero{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(3,1fr);grid-template-rows:none}
 .stat{flex-direction:column;align-items:flex-start;padding:12px 14px}.stat span{text-align:left;font-size:.78rem}.stat b{font-size:1.6rem}
 .qgrid{grid-template-columns:1fr}
 .side{position:static;order:2}
 .rhero{justify-items:center;text-align:center}.kp{justify-content:center}
}
@media(max-width:600px){

.tfb:active:not([disabled]){transform:translate(2px,2px);box-shadow:0 0 0 var(--sh)}
.tfb.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);box-shadow:2px 2px 0 var(--acc)}
.tfb.ok{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:2px 2px 0 var(--ok)}
.tfb.bad{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:2px 2px 0 var(--bad)}

.tfrow.ok{background:var(--okbg);border-color:var(--ok)}

.sa:disabled{opacity:.8;background:var(--surface2)}

.unit{font-weight:700;color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.ansline{margin-top:6px;font-size:1.05rem}.ansline b{display:inline;font-family:var(--f-mono)}
.fb .ansline b{color:inherit}
.chips.types .chip{display:inline-flex;align-items:center;gap:6px}
.field{width:100%;padding:13px 16px;border:2px solid var(--bd);border-radius:14px;font:inherit;background:var(--surface);color:var(--ink);box-shadow:3px 3px 0 var(--sh)}
.field:focus{outline:3px solid var(--acc);outline-offset:2px}
.start .btns{display:flex;gap:12px;flex-wrap:wrap}
.start .btn.sec{font-size:1rem;padding:14px 20px}
.kview{display:grid;gap:14px;margin-bottom:18px}

.nb.part{background:var(--warn);color:#16131f;border-color:var(--warn)}
@media print{

}

"mcq","q":"Quá trình pha loãng dung dịch đậm đặc của acid nào sau đây tỏa rất nhiều nhiệt nên không được tự ý pha loãng?","o":["HCl.","H_{2}SO_{4}.","CH_{3}COOH.","HNO_{3}."],"a":1,"lesson":"Sulfuric acid và muối sulfate","id":64},{"type":"mcq","q":"Ở thể lỏng, chất nào sau đây có dạng sánh như dầu do tồn tại liên kết hydrogen rất mạnh giữa các phân tử?","o":["HF.","H_{2}SO_{4}.","H_{2}O.","CH_{3}COOH."],"a":1,"lesson":"Sulfuric acid và muối sulfate","id":65},{"type":"mcq","q":"Cách pha loãng dung dịch H_{2}SO_{4} đặc nào sau đây đúng?","o":["Rót nhanh acid vào nước và khuấy đều.","Rót nhanh nước vào acid và khuấy đều.","Rót từ từ nước vào acid và khuấy đều.","Rót từ từ acid vào nước và khuấy đều."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":66},{"type":"mcq","q":"Bước sơ cứu đầu tiên cần làm ngay khi một người bị bỏng sulfuric acid là","o":["Rửa với nước lạnh nhiều lần.","Trung hòa acid bằng NaHCO_{3}.","Băng bó tạm thời vết bỏng.","Đưa đến cơ sở y tế gần nhất."],"a":0,"lesson":"Sulfuric acid và muối sulfate","id":67},{"type":"mcq","q":"Trong công nghiệp sản xuất sulfuric acid, sulfur trioxide được hấp thụ vào dung dịch sulfuric acid đặc tạo thành những chất có công thức chung là","o":["H_{2}S_{2}O_{7}.","H_{2}SO_{4}.","H_{2}SO_{4}·nSO_{3}.","(SO_{3})_{n}."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":68},{"type":"mcq","q":"Acid H_{2}SO_{4} loãng tác dụng với Fe tạo thành sản phẩm:","o":["Fe_{2}(SO_{4})_{3} và H_{2}.","FeSO_{4} và H_{2}.","FeSO_{4} và SO_{2}.","Fe_{2}(SO_{4})_{3} và SO_{2}."],"a":1,"lesson":"Sulfuric acid và muối sulfate","id":69},{"type":"mcq","q":"Dung dịch H_{2}SO_{4} loãng phản ứng được với tất cả các kim loại thuộc dãy nào sau đây?","o":["Cu, Na.","Ag, Zn.","Mg, Al.","Au, Pt."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":70},{"type":"mcq","q":"Trong các chất sau, chất nào phản ứng được với dung dịch H_{2}SO_{4} loãng?","o":["CuS.","FeS.","Cu.","Ag."],"a":1,"lesson":"Sulfuric acid và muối sulfate","id":71},{"type":"mcq","q":"Kim loại nào sau đây không tác dụng với dung dịch H_{2}SO_{4} loãng?","o":["Al.","Zn.","Na.","Cu."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":72},{"type":"mcq","q":"Người ta đun nóng Cu với dung dịch H_{2}SO_{4} đặc, nóng. Khí sinh ra có tên gọi là","o":["Khí oxygen.","Khí hydrogen.","Khí carbonic.","Khí sulfur dioxide."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":73},{"type":"mcq","q":"Các khí sinh ra trong thí nghiệm phản ứng của saccharose (C_{12}H_{22}O_{11}) với dung dịch H_{2}SO_{4} đặc bao gồm:","o":["H_{2}S và CO_{2}.","H_{2}S và SO_{2}.","SO_{3} và CO_{2}.","SO_{2} và CO_{2}."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":74},{"type":"mcq","q":"H_{2}SO_{4} đặc nóng không tác dụng với chất nào sau đây?","o":["Fe.","NaCl rắn.","Ag.","Au."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":75},{"type":"mcq","q":"Dãy chất nào sau đây phản ứng được với dung dịch sulfuric acid đặc nguội?","o":["Au, Cu.","Mg, Fe.","Zn, NaOH.","Al, S."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":76},{"type":"mcq","q":"Sulfuric acid đặc, nguội có thể đựng trong bình chứa làm bằng","o":["Cu.","Ag.","Ca.","Al."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":77},{"type":"mcq","q":"Hai chất nào sau đây khi trộn với nhau có thể xảy ra phản ứng hóa học?","o":["S + H_{2}SO_{4} đặc.","CO_{2} + BaCl_{2}.","FeCl_{2} + H_{2}S.","HNO_{3} + Na_{2}SO_{4}."],"a":0,"lesson":"Sulfuric acid và muối sulfate","id":78},{"type":"mcq","q":"Dung dịch sulfuric acid đặc khác dung dịch sulfuric acid loãng ở tính chất hóa học nào?","o":["Tính base mạnh.","Tính oxi hóa mạnh.","Tính acid mạnh.","Tính khử mạnh."],"a":1,"lesson":"Sulfuric acid và muối sulfate","id":79},{"type":"mcq","q":"Trong công nghiệp, hydrogen fluoride được điều chế từ quặng fluorite theo phản ứng: CaF_{2} + H_{2}SO_{4} (đặc, 250°C) → CaSO_{4} + 2HF. Vai trò của sulfuric acid trong phản ứng là","o":["base.","chất oxi hóa.","acid.","chất khử."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":80},{"type":"mcq","q":"Sulfuric acid đặc thể hiện tính chất nào khi lấy nước từ hợp chất carbohydrate và khiến chúng hóa đen?","o":["Tính acid.","Tính base.","Tính háo nước.","Tính dễ tan."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":81},{"type":"mcq","q":"Để nhận biết anion có trong dung dịch K_{2}SO_{4}, không thể dùng thuốc thử nào sau đây?","o":["Ba(OH)_{2}.","BaCl_{2}.","Ba(NO_{3})_{2}.","MgCl_{2}."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":82},{"type":"mcq","q":"Phân biệt được dung dịch Na_{2}SO_{4} và NaCl bằng dung dịch nào sau đây?","o":["MgCl_{2}.","FeCl_{2}.","HCl.","BaCl_{2}."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":83},{"type":"mcq","q":"Muối X không tan trong nước và các dung môi hữu cơ. Trong y học, X thường được dùng làm chất cản quang xét nghiệm X-quang đường tiêu hóa. Công thức của X là","o":["BaSO_{4}.","Na_{2}SO_{4}.","K_{2}SO_{4}.","MgSO_{4}."],"a":0,"lesson":"Sulfuric acid và muối sulfate","id":84},{"type":"mcq","q":"Dãy kim loại nào trong các dãy sau đây gồm các kim loại không tác dụng với dung dịch H_{2}SO_{4} đặc, nguội?","o":["Al, Fe, Au, Pt.","Zn, Pt, Au, Mg.","Al, Fe, Zn, Mg.","Al, Fe, Au, Mg."],"a":0,"lesson":"Sulfuric acid và muối sulfate","id":85},{"type":"mcq","q":"Dãy chất nào sau đây bị thụ động trong H_{2}SO_{4} đặc, nguội?","o":["Mg, Cu, Ag.","Ca, Ag, Mg.","Cu, Zn, Mg.","Al, Fe, Cr."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":86},{"type":"mcq","q":"Người ta thường dùng các bình bằng thép để đựng và vận chuyển chở dung dịch H_{2}SO_{4} đặc vì","o":["thép bị thụ động hóa trong dung dịch H_{2}SO_{4} đặc, nguội.","dung dịch H_{2}SO_{4} đặc không phản ứng với sắt ở nhiệt độ thường.","dung dịch H_{2}SO_{4} đặc không phản ứng với kim loại ở nhiệt độ thường.","thép có chứa các chất phụ trợ không phản ứng với dung dịch H_{2}SO_{4} đặc."],"a":0,"lesson":"Sulfuric acid và muối sulfate","id":87},{"type":"mcq","q":"Dung dịch sulfuric acid loãng tác dụng được với 2 chất trong dãy nào sau đây?","o":["S và H_{2}S.","Fe và Fe(OH)_{3}.","Cu và Cu(OH)_{2}.","C và CO_{2}."],"a":1,"lesson":"Sulfuric acid và muối sulfate","id":88},{"type":"mcq","q":"Trường hợp nào sau đây có phản ứng?","o":["H_{2}SO_{4} loãng + Cu.","H_{2}SO_{4} loãng + S.","H_{2}SO_{4} đặc, nguội + Al.","H_{2}SO_{4} đặc + Na_{2}CO_{3}."],"a":3,"lesson":"Sulfuric acid và muối sulfate","id":89},{"type":"mcq","q":"Nhóm gồm tất cả các kim loại tan trong dung dịch H_{2}SO_{4} đặc nóng nhưng không tan trong dung dịch H_{2}SO_{4} loãng là:","o":["Hg, Ag, Cu.","Al, Fe, Cr.","Ag, Fe, Pt.","Al, Cu, Au."],"a":0,"lesson":"Sulfuric acid và muối sulfate","id":90},{"type":"mcq","q":"Cho FeCO_{3} tác dụng với H_{2}SO_{4} đặc nóng dư. Sản phẩm khí thu được là","o":["CO_{2}.","H_{2} và CO_{2}.","SO_{2} và CO_{2}.","SO_{2}."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":91},{"type":"mcq","q":"Cho phản ứng: S + 2H_{2}SO_{4} (đặc) → 3SO_{2} + 2H_{2}O. Tỉ lệ giữa số nguyên tử sulfur bị khử và số nguyên tử sulfur bị oxi hóa là","o":["1 : 2.","1 : 3.","3 : 1.","2 : 1."],"a":3,"lesson":"Sulfuric acid và muối sulfate","note":"S (0) → S (+4): 1 nguyên tử S bị oxi hóa. S (+6) → S (+4): 2 nguyên tử S bị khử. Tỉ lệ bị khử : bị oxi hóa = 2 : 1.","id":92},{"type":"mcq","q":"Phản ứng nào sau đây không xảy ra?","o":["2Al + 3H_{2}SO_{4} → Al_{2}(SO_{4})_{3} + 3H_{2}.","2Na + H_{2}SO_{4} → Na_{2}SO_{4} + H_{2}.","Cu + H_{2}SO_{4} → CuSO_{4} + H_{2}.","Zn + H_{2}SO_{4} → ZnSO_{4} + H_{2}."],"a":2,"lesson":"Sulfuric acid và muối sulfate","id":93},{"type":"mcq","q":"Phản ứng nào sau đây không đúng?","o":["2Al + 3H_{2}SO_{4} → Al_{2}(SO_{4})_{3} + 3H_{2}.","2Fe + 3H_{2}SO_{4} → Fe_{2}(SO_{4})_{3} + 3H_{2}.","Fe + H_{2}SO_{4} → FeSO_{4} + H_{2}.","Pb + H_{2}SO_{4} → PbSO_{4} + H_{2}."],"a":1,"lesson":"Sulfuric acid và muối sulfate","note":"Fe tác dụng với H_{2}SO_{4} loãng chỉ tạo muối sắt(II): Fe + H_{2}SO_{4} → FeSO_{4} + H_{2}.","id":94},{"type":"mcq","q":"Phản ứng nào dưới đây không đúng?","o":["H_{2}SO_{4} đặc + FeO → FeSO_{4} + H_{2}O.","H_{2}SO_{4} đặc + 2HI → I_{2} + SO_{2} + 2H_{2}O.","2H_{2}SO_{4} đặc + C → CO_{2} + 2SO_{2} + 2H_{2}O.","6H_{2}SO_{4} đặc + 2Fe → Fe_{2}(SO_{4})_{3} + 3SO_{2} + 6H_{2}O."],"a":0,"lesson":"Sulfuric acid và muối sulfate","note":"H_{2}SO_{4} đặc oxi hóa FeO lên Fe(III): 2FeO + 4H_{2}SO_{4} → Fe_{2}(SO_{4})_{3} + SO_{2} + 4H_{2}O.","id":95},{"type":"tf","lesson":"Đề kiểm tra tổng hợp","q":"Cho hai phản ứng hóa học:\n(1) N_{2}(g) + 3H_{2}(g) ⇌ 2NH_{3}(g), Δ_{r}H°_{298} = −92 kJ\n(2) N_{2}(g) + O_{2}(g) ⇌ 2NO(g), Δ_{r}H°_{298} = 180 kJ","s":[{"t":"Phản ứng (1) và phản ứng (2) đều tỏa nhiệt theo chiều thuận.","v":false,"n":"Sai. Phản ứng (1) tỏa nhiệt (ΔH < 0), phản ứng (2) thu nhiệt (ΔH > 0)."},{"t":"Trong phản ứng (1) N_{2} thể hiện tính oxi hóa, trong phản ứng (2) N_{2} thể hiện tính khử.","v":true,"n":"Đúng. (1) N(0) → N(−3): N_{2} là chất oxi hóa; (2) N(0) → N(+2): N_{2} là chất khử."},{"t":"Phản ứng (1) là quá trình trung gian để sản xuất nitric acid, đạm nitrate,…","v":false,"n":"Sai. Phản ứng (1) tạo ra NH_{3} (ammonia), là nguyên liệu sản xuất đạm nitrate, nitric acid chứ không phải là quá trình trung gian trực tiếp."},{"t":"Phản ứng (2) xảy ra trong những cơn mưa dông kèm theo sấm sét.","v":true,"n":"Đúng. Nitrogen tác dụng với oxygen ở nhiệt độ khoảng 3000 °C hoặc khi có tia lửa điện."}],"id":96},{"type":"tf","lesson":"Đề kiểm tra tổng hợp","q":"Sơ đồ quy trình dưới đây mô tả các bước trong quá trình sản xuất phân bón (Z):\nSO_{2} + O_{2} →(1) A(g) →(2) +H_{2}SO_{4} hợp chất Q →(3) +H_{2}O hợp chất X\nN_{2} + H_{2} →(4) hợp chất Y\nX + Y →(5) phân bón Z","s":[{"t":"Q có tên gọi là oleum.","v":true,"n":"Đúng. Q là H_{2}SO_{4}·nSO_{3} (oleum)."},{"t":"X có công thức là H_{2}SO_{4}.","v":true,"n":"Đúng. Oleum + H_{2}O → H_{2}SO_{4}."},{"t":"Y có khả năng nhận proton khi phản ứng với nước.","v":true,"n":"Đúng. Y là NH_{3}, có tính base, nhận H^{+} từ H_{2}O: NH_{3} + H_{2}O ⇌ NH_{4}^{+} + OH^{−}."},{"t":"Phần trăm khối lượng của nguyên tố N trong Z là 12,12%.","v":false,"n":"Sai. Z là (NH_{4})_{2}SO_{4}, %N = 28/132 × 100% ≈ 21,21%."}],"id":97},{"type":"tf","lesson":"Nitrogen và hợp chất","q":"Xét tính đúng/sai của các phát biểu về HNO_{3}:","s":[{"t":"Dung dịch nitric acid làm quỳ tím chuyển màu đỏ.","v":true,"n":"Đúng. HNO_{3} là acid mạnh."},{"t":"Tất cả các basic oxide và oxide khi tác dụng với HNO_{3} đặc đều thu được muối nitrate và nước.","v":false,"n":"Sai. Với oxide có tính khử (như FeO, Fe_{3}O_{4}), HNO_{3} đặc tạo muối sắt(III), sản phẩm khử (NO_{2}) và H_{2}O."},{"t":"Một số muối có thể tác dụng với HNO_{3} tạo muối nitrate và acid yếu hơn.","v":true,"n":"Đúng. Ví dụ: CaCO_{3} + 2HNO_{3} → Ca(NO_{3})_{2} + CO_{2} + H_{2}O."},{"t":"Nitric acid khi tác dụng với muối có thể tạo ra muối nitrate như NH_{4}NO_{3}, Ca(NO_{3})_{2} là phân đạm cung cấp nguyên tố nitrogen cho cây trồng.","v":true,"n":"Đúng. Các muối nitrate như NH_{4}NO_{3}, Ca(NO_{3})_{2} là phân đạm."}],"id":98},{"type":"tf","lesson":"Nitrogen và hợp chất","q":"Phú dưỡng là hiện tượng dư thừa quá nhiều các nguyên tố dinh dưỡng (N, P) trong các nguồn nước làm cho các sinh vật phát triển trong nước như vi khuẩn, tảo, rong, rêu,… phát triển nhanh.","s":[{"t":"Nguyên nhân gây ra hiện tượng phú dưỡng do nguồn nước thải nông nghiệp, công nghiệp, sinh hoạt chưa xử lý triệt để thải vào ao hồ.","v":true,"n":"Đúng."},{"t":"Hiện tượng phú dưỡng làm giảm sự quang hợp của thực vật thủy sinh và làm tăng nguồn oxygen của tôm, cá,… gây mất cân bằng hệ sinh thái.","v":false,"n":"Sai. Phú dưỡng làm suy giảm lượng oxygen hòa tan trong nước, gây chết tôm, cá."},{"t":"Các loại tôm, cá,… ở ao hồ có hiện tượng phú dưỡng thường khỏe mạnh và béo tốt vì có nguồn chất dinh dưỡng phong phú.","v":false,"n":"Sai. Tôm, cá bị thiếu oxygen và nhiễm độc nên chết ngạt."},{"t":"Để khắc phục hiện tượng phú dưỡng ta cần xử lý nước thải trước khi thải vào môi trường, sử dụng phân bón đúng liều lượng, khơi thông kênh rạch, ao hồ, lưu thông dòng nước.","v":true,"n":"Đúng."}],"id":99},{"type":"tf","lesson":"Sulfur và hợp chất","q":"Trắc nghiệm đúng – sai về sulfur:","s":[{"t":"Cấu hình electron của nguyên tử sulfur là 1s^{2} 2s^{2} 2p^{6} 3s^{2} 3p^{4}.","v":true,"n":"Đúng. Sulfur có Z = 16."},{"t":"Trong bảng tuần hoàn, sulfur thuộc ô số 16, chu kì 4, nhóm VIA.","v":false,"n":"Sai. Sulfur thuộc chu kì 3 (có 3 lớp electron)."},{"t":"Phân tử sulfur gồm 6 nguyên tử liên kết với nhau tạo thành vòng khép kín.","v":false,"n":"Sai. Phân tử sulfur gồm 8 nguyên tử (S_{8})."},{"t":"Liên kết giữa các nguyên tử trong phân tử sulfur thuộc loại liên kết cộng hóa trị không phân cực.","v":true,"n":"Đúng. Các nguyên tử cùng là nguyên tố S."}],"id":100},{"type":"tf","lesson":"Sulfuric acid và muối sulfate","q":"H_{2}SO_{4} đặc gây nguy hiểm khi tiếp xúc với da nên cần lưu ý khi sử dụng và bảo quản:","s":[{"t":"Cần bảo quản H_{2}SO_{4} trong chai lọ đậy chặt, đặt ở vị trí chắc chắn.","v":true,"n":"Đúng."},{"t":"Khi làm thí nghiệm với H_{2}SO_{4} đặc cần dùng găng tay, không cần đeo kính bảo hộ và áo thí nghiệm.","v":false,"n":"Sai. Cần đeo đầy đủ kính bảo hộ, găng tay và áo blouse phòng thí nghiệm."},{"t":"Khi bị bỏng H_{2}SO_{4} đặc thì việc đầu tiên cần làm là nhanh chóng rửa ngay với nước lạnh nhiều lần.","v":true,"n":"Đúng. Rửa xả dưới dòng nước chảy liên tục."},{"t":"H_{2}SO_{4} đặc không quá nguy hiểm nên khi bị bỏng không cần thiết phải đến cơ sở y tế.","v":false,"n":"Sai. Bỏng H_{2}SO_{4} ăn sâu vào da rất nguy hiểm, cần đến cơ sở y tế."}],"id":101},{"type":"tf","lesson":"Sulfuric acid và muối sulfate","q":"Xét tính chất hóa học của H_{2}SO_{4} loãng:","s":[{"t":"Dung dịch H_{2}SO_{4} loãng đổi màu quỳ tím thành đỏ.","v":true,"n":"Đúng."},{"t":"Cho Fe vào dung dịch H_{2}SO_{4} loãng tạo thành muối Fe_{2}(SO_{4})_{3} và H_{2}.","v":false,"n":"Sai. H_{2}SO_{4} loãng chỉ tạo FeSO_{4} (muối sắt(II)) và H_{2}."},{"t":"Cu không tan trong dung dịch H_{2}SO_{4} loãng nhưng CuO thì tan tạo thành dung dịch có màu xanh lam.","v":true,"n":"Đúng. CuO + H_{2}SO_{4} → CuSO_{4} (xanh lam) + H_{2}O."},{"t":"Nhỏ dung dịch BaCl_{2} vào dung dịch H_{2}SO_{4} thấy xuất hiện kết tủa trắng và có khí thoát ra.","v":false,"n":"Sai. Chỉ tạo kết tủa BaSO_{4} màu trắng, không có khí thoát ra."}],"id":102},{"type":"tf","lesson":"Sulfuric acid và muối sulfate","q":"Xét tính chất hóa học của H_{2}SO_{4} đặc:","s":[{"t":"H_{2}SO_{4} ngoài có tính chất của acid mạnh còn có tính oxi hóa mạnh.","v":true,"n":"Đúng."},{"t":"Tất cả các kim loại đều có thể tan được trong dung dịch H_{2}SO_{4} đặc nóng.","v":false,"n":"Sai. Au và Pt không tan trong H_{2}SO_{4} đặc, nóng."},{"t":"Al, Fe, Cr không tan trong dung dịch H_{2}SO_{4} đặc, nguội do bị thụ động hóa.","v":true,"n":"Đúng."},{"t":"Khi cho H_{2}SO_{4} đặc vào cốc saccharose thì thấy chất rắn chuyển dần sang màu đen và trào lên khỏi miệng cốc.","v":true,"n":"Đúng. Do tính háo nước, đồng thời H_{2}SO_{4} oxi hóa C tạo CO_{2} và SO_{2}."}],"id":103},{"type":"tf","lesson":"Sulfuric acid và muối sulfate","q":"H_{2}SO_{4} có nhiều ứng dụng trong đời sống và sản xuất:","s":[{"t":"Dùng để sản xuất ắc quy.","v":true,"n":"Đúng."},{"t":"Dùng để sản xuất xà phòng.","v":true,"n":"Đúng."},{"t":"Dùng để sản xuất phân bón.","v":true,"n":"Đúng."},{"t":"Dùng để sản xuất sơn.","v":true,"n":"Đúng."}],"id":104},{"type":"short","lesson":"Đề kiểm tra tổng hợp","q":"Phân tử NH_{3} có bao nhiêu liên kết sigma?","kind":"num","ans":"3","note":"Phân tử NH_{3} có 3 liên kết đơn N–H, mỗi liên kết đơn là 1 liên kết sigma (σ).","tol":0,"id":105},{"type":"short","lesson":"Đề kiểm tra tổng hợp","q":"Cho phản ứng: aFe + bHNO_{3} → cFe(NO_{3})_{3} + dNO↑ + eH_{2}O. Hệ số tỉ lượng a, b, c, d, e là những số nguyên dương có tỉ lệ tối giản. Tổng (a + b) bằng bao nhiêu?","kind":"num","ans":"5","note":"Phản ứng cân bằng: Fe + 4HNO_{3} → Fe(NO_{3})_{3} + NO + 2H_{2}O. Ta có a = 1, b = 4 ⇒ a + b = 5.","tol":0,"id":106},{"type":"short","lesson":"Đề kiểm tra tổng hợp","q":"Cho SO_{2} tác dụng với các chất: (1) H_{2}O, (2) CaO, (3) H_{2}S, (4) Mg, (5) NaOH, (6) O_{2}, (7) NO_{2}. Hãy sắp xếp các phản ứng chứng tỏ SO_{2} là một acidic oxide thành bộ số theo thứ tự tăng dần.","kind":"digits","ans":"125","note":"SO_{2} thể hiện tính chất của acidic oxide khi tác dụng với nước (1), basic oxide CaO (2) và dung dịch base NaOH (5). Các phản ứng (3), (4), (6), (7) là phản ứng oxi hóa – khử.","id":107},{"type":"short","lesson":"Đề kiểm tra tổng hợp","q":"Oleum Z (H_{2}SO_{4}·nSO_{3}) được tạo thành khi cho 100 kg dung dịch H_{2}SO_{4} 98% hấp thụ hoàn toàn 30 kg SO_{3}. Phần trăm khối lượng SO_{3} trong Z là b%. Giá trị của b là bao nhiêu? (Làm tròn đến hàng phần trăm)","kind":"num","ans":"16.24","note":"m(H_{2}O trong dung dịch 98%) = 2 kg. 2 kg H_{2}O tác dụng với 2 × 80/18 ≈ 8,89 kg SO_{3} để thành H_{2}SO_{4}. Khối lượng SO_{3} còn dư = 30 − 8,89 = 21,11 kg. Khối lượng oleum Z = 100 + 30 = 130 kg. Vậy b% = 21,11/130 × 100% ≈ 16,24%.","unit":"%","tol":0.01,"id":108},{"type":"short","lesson":"Đề kiểm tra tổng hợp","q":"Sulfuric acid có thể được điều chế từ quặng pyrite theo sơ đồ:\nFeS_{2} →(1) SO_{2} →(2) SO_{3} →(3) H_{2}SO_{4}\nTrong đó: (1) +O_{2}, t°; (2) +O_{2}, t°; (3) +H_{2}O. Biết hiệu suất của cả quá trình là 90%, các tạp chất trong quặng không chứa sulfur. Thể tích dung dịch H_{2}SO_{4} 95% (D = 1,82 g/mL) thu được từ 1 tấn quặng pyrite (chứa 80% FeS_{2}) là bao nhiêu lít? (Làm tròn đến hàng đơn vị)","kind":"num","ans":"680","note":"m(FeS_{2}) = 1 tấn × 80% = 800 000 g. Sơ đồ bảo toàn S: FeS_{2} → 2H_{2}SO_{4} (120 g → 196 g). Theo lí thuyết: m(H_{2}SO_{4}) = 800 000 × 196/120 ≈ 1 306 666,67 g. Với H = 90%: m(H_{2}SO_{4} thực tế) = 1 176 000 g. Khối lượng dung dịch 95%: 1 176 000 × 100/95 ≈ 1 237 894,74 g. Thể tích: V = 1 237 894,74/1,82 ≈ 680 162 mL ≈ 680 lít.","unit":"lít","tol":0.5,"id":109},{"type":"short","lesson":"Nitrogen và hợp chất","q":"Xét phản ứng: N_{2}(g) + O_{2}(g) ⇌ 2NO(g), Δ_{r}H°_{298} = 180,6 kJ. Nhiệt tạo thành chuẩn của NO(g) là bao nhiêu kJ/mol?","kind":"num","ans":"90.3","note":"Δ_{f}H°_{298}(NO) = Δ_{r}H°_{298}/2 = 180,6/2 = 90,3 kJ/mol.","unit":"kJ/mol","tol":0.01,"id":110},{"type":"short","lesson":"Nitrogen và hợp chất","q":"Cho dung dịch HNO_{3} tác dụng với các chất sau: NH_{3}, CaCO_{3}, Ag, NaOH. Có bao nhiêu phản ứng trong đó HNO_{3} đóng vai trò acid theo Bronsted?","kind":"num","ans":"3","note":"NH_{3} (nhận H^{+}), CaCO_{3} (trao đổi H^{+}), NaOH (trung hòa H^{+}) — HNO_{3} đóng vai trò acid. Với Ag, HNO_{3} đóng vai trò chất oxi hóa. Tổng cộng 3 phản ứng.","tol":0,"src":"KNTT – SBT","id":111},{"type":"short","lesson":"Nitrogen và hợp chất","q":"Cho các chất: Cu, Al, MgO, Fe_{3}O_{4}, Fe(OH)_{2}, CaCO_{3}, K_{2}SO_{4} lần lượt tác dụng với dung dịch HNO_{3} loãng. Có bao nhiêu trường hợp xảy ra phản ứng oxi hóa – khử?","kind":"num","ans":"4","note":"Các chất có tính khử: Cu, Al, Fe_{3}O_{4}, Fe(OH)_{2} tác dụng với HNO_{3} loãng tạo phản ứng oxi hóa – khử (4 chất). MgO, CaCO_{3} chỉ xảy ra phản ứng trao đổi; K_{2}SO_{4} không phản ứng.","tol":0,"id":112},{"type":"short","lesson":"Nitrogen và hợp chất","q":"Cho phản ứng: aFe + bHNO_{3} → cFe(NO_{3})_{3} + dNO_{2}↑ + eH_{2}O. Hệ số tỉ lượng a, b, c, d, e là những số nguyên dương có tỉ lệ tối giản. Tổng (a + b) bằng bao nhiêu?","kind":"num","ans":"7","note":"Phản ứng: Fe + 6HNO_{3} → Fe(NO_{3})_{3} + 3NO_{2} + 3H_{2}O. Tỉ lệ tối giản a = 1, b = 6 ⇒ a + b = 7.","tol":0,"id":113},{"type":"short","lesson":"Nitrogen và hợp chất","q":"Cho m gam Al phản ứng hoàn toàn với dung dịch HNO_{3} loãng dư, thu được 4,958 lít khí NO (đkc, sản phẩm khử duy nhất). Giá trị của m bằng bao nhiêu?","kind":"num","ans":"5.4","note":"n(NO) = 4,958/24,79 = 0,2 mol. Bảo toàn electron: 3 × n(Al) = 3 × n(NO) ⇒ n(Al) = 0,2 mol. m(Al) = 0,2 × 27 = 5,4 g.","unit":"gam","tol":0.01,"id":114},{"type":"short","lesson":"Nitrogen và hợp chất","q":"Cho 2,19 gam hỗn hợp gồm Cu, Al tác dụng hoàn toàn với dung dịch HNO_{3} dư, thu được dung dịch X và 0,03 mol khí NO (sản phẩm khử duy nhất). Khối lượng muối trong X là bao nhiêu gam?","kind":"num","ans":"7.77","note":"n(NO_{3}^{−} trong muối) = n(electron nhường) = 3 × n(NO) = 0,09 mol. m(muối) = m(kim loại) + m(NO_{3}^{−}) = 2,19 + 0,09 × 62 = 7,77 g.","unit":"gam","tol":0.01,"id":115},{"type":"short","lesson":"Sulfur và hợp chất","q":"Cho các phản ứng:\n(1) S + O_{2} → SO_{2}\n(2) S + 3F_{2} → SF_{6}\n(3) Hg + S → HgS\n(4) H_{2} + 1/8 S_{8} → H_{2}S\nHãy sắp xếp các phản ứng trong đó sulfur đơn chất đóng vai trò chất khử thành bộ số theo thứ tự tăng dần.","kind":"digits","ans":"12","note":"Trong (1) và (2), S tăng số oxi hóa từ 0 lên +4 và +6 nên S là chất khử. Trong (3) và (4), S giảm từ 0 xuống −2 nên S là chất oxi hóa.","src":"KNTT – SBT","id":116},{"type":"short","lesson":"Sulfur và hợp chất","q":"Cho các phản ứng sinh ra khí SO_{2}:\n(1) 4FeS_{2} + 11O_{2} → 2Fe_{2}O_{3} + 8SO_{2}\n(2) S + O_{2} → SO_{2}\n(3) Cu + 2H_{2}SO_{4} → CuSO_{4} + SO_{2} + 2H_{2}O\n(4) Na_{2}SO_{3} + H_{2}SO_{4} → Na_{2}SO_{4} + SO_{2} + H_{2}O\nHãy sắp xếp các phản ứng dùng để điều chế khí SO_{2} trong công nghiệp thành bộ số theo thứ tự tăng dần.","kind":"digits","ans":"12","note":"Trong công nghiệp, SO_{2} được sản xuất từ đốt quặng pyrite (1) và đốt sulfur (2). Phản ứng (3), (4) dùng điều chế SO_{2} trong phòng thí nghiệm.","id":117},{"type":"short","lesson":"Sulfur và hợp chất","q":"Cho các phát biểu sau:\n(1) Sulfur là chất rắn, màu trắng, không tan trong nước.\n(2) Sulfur và sulfur dioxide vừa có tính oxi hóa, vừa có tính khử.\n(3) Khi phản ứng với hydrogen, sulfur thể hiện tính oxi hóa.\n(4) Nước thải sinh hoạt là một trong các nguồn phát thải khí SO_{2}.\n(5) Sulfur dioxide được sử dụng để tẩy trắng vải sợi, bột giấy, sản xuất sulfuric acid,…\nHãy sắp xếp các phát biểu đúng thành bộ số theo thứ tự tăng dần.","kind":"digits","ans":"235","note":"(1) sai: sulfur có màu vàng; (4) sai: nước thải sinh hoạt không phát thải SO_{2} (có thể sinh ra H_{2}S); SO_{2} phát thải chủ yếu từ đốt nhiên liệu hóa thạch, luyện kim, nhà máy công nghiệp. Các phát biểu (2), (3), (5) đúng.","src":"KNTT – SBT","id":118},{"type":"short","lesson":"Sulfur và hợp chất","q":"Cho các phát biểu sau:\n(1) Trong tự nhiên, sulfur tồn tại chủ yếu ở dạng muối sulfide và muối sulfate,…\n(2) Là một phi kim hoạt động nên trong tự nhiên không tìm thấy sulfur đơn chất.\n(3) Trứng gà ung có mùi thối đặc trưng một phần do các hợp chất của sulfur,…\n(4) Nguyên tố sulfur có mặt trong một số loại thực vật (hành, tỏi, sầu riêng,…).\n(5) Thành phần chính của quặng pyrite là hợp chất của sulfur và chì (lead, Pb).\nHãy sắp xếp các phát biểu đúng thành bộ số theo thứ tự tăng dần.","kind":"digits","ans":"134","note":"(2) sai: có mỏ sulfur đơn chất; (5) sai: pyrite là FeS_{2}, không phải hợp chất của chì. Các phát biểu (1), (3), (4) đúng.","id":119},{"type":"short","lesson":"Sulfuric acid và muối sulfate","q":"Cho các chất: (1) Cu, (2) Fe, (3) MgO, (4) NaOH, (5) KNO_{3}, (6) CaCO_{3} lần lượt tác dụng dung dịch H_{2}SO_{4} loãng. Hãy sắp xếp các trường hợp xảy ra phản ứng thành bộ số theo thứ tự tăng dần.","kind":"digits","ans":"2346","note":"Cu và KNO_{3} không phản ứng với H_{2}SO_{4} loãng. Các chất phản ứng là Fe (2), MgO (3), NaOH (4), CaCO_{3} (6).","id":120}];

 function init(){

  ctx=new AC();master=ctx.createGain();master.gain.value=st.vol;
  const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
  fx=ctx.createGain();fx.connect(master);

  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}

 function tone(f,t,d,o={}){

function shortRight(q,v){
 v=String(v||'').trim();if(!v)return false;
 if(q.kind==='digits')return v.replace(/\D/g,'')===q.ans;
 const m=v.replace(/\s+/g,'').match(/[-−]?\d+(?:[.,]\d+)?/);if(!m)return false;
 const x=parseFloat(m[0].replace('−','-').replace(',','.'));
 return Math.abs(x-parseFloat(q.ans))<=(q.tol||0)+1e-9;
}
const ansText=q=>q.kind==='digits'?q.ans:q.ans.replace('.',',');
const tfCount=(q,pick)=>q.s.reduce((n,s,i)=>n+(pick[i]===s.v?1:0),0);
function isDone(s,id){const r=s.rec[id],q=Q[id],ex=s.mode==='exam';
 if(q.type==='mcq')return ex?r.pick!==null:(r.solved||r.revealed);
 if(q.type==='tf')return ex?r.pick.some(x=>x!==null):r.checked;
 return ex?String(r.val).trim()!=='':(r.solved||r.revealed)}

/* ---------- XEM ĐÁP ÁN / IN ĐỀ (dành cho giáo viên) ---------- */
let keyQ='';
function searchText(q){return [q.q,...(q.o||[]),...(q.s||[]).flatMap(s=>[s.t,s.n]),q.ans||'',q.note||'',q.lesson].join(' ')}
function keyHtml(q,n){
 let body='';
 if(q.type==='mcq'){
  body=`<div class="opts">${q.o.map((o,i)=>`<div class="opt ${i===q.a?'ok':'dim'}"><span class="k">${'ABCD'[i]}</span><span class="t">${rt(o)}</span><span class="s">${i===q.a?I.ok:''}</span></div>`).join('')}</div>`+(q.note?`<div class="fb info"><div class="note" style="margin:0">${rt(q.note)}</div></div>`:'');
 }else if(q.type==='tf'){
  body=`<div class="tfrows">${q.s.map((s,i)=>`<div class="tfrow static ${s.v?'ok':'bad'}"><span class="k">${'abcd'[i]}</span><div class="stx"><span class="vb ${s.v?'t':'f'}">${s.v?'ĐÚNG':'SAI'}</span>${rt(s.t)}</div>${s.n?`<div class="tfnote">${rt(s.n)}</div>`:''}</div>`).join('')}</div>`;
 }else{
  body=`<div class="shortbox ok"><small>Đáp án</small><b style="font-size:1.25rem">${esc(ansText(q))}</b>${q.unit?` <span class="unit">${rt(q.unit)}</span>`:''}</div><div class="fb info"><div class="note" style="margin:0">${rt(q.note)}</div></div>`;
 }
 return `<article class="card rvi static" style="--i:${Math.min(n,10)}"><div class="qmeta"><span class="qn">Câu ${n+1}</span><span class="tt ${q.type}">${TYPES[q.type]}</span><span class="lesson">${esc(q.lesson)}${q.src?` · ${esc(q.src)}`:''}</span></div><div class="qtext">${rt(q.q)}</div>${body}</article>`;
}
function drawKeyList(){
 const nq=norm(keyQ.trim());
 const ids=poolAll().filter(id=>!nq||norm(plain(searchText(Q[id]))).includes(nq));
 $('#kcount').innerHTML=`<b>${ids.length}</b> câu${keyQ.trim()?` khớp “${esc(keyQ.trim())}”`:''}`;
 $('#kl').innerHTML=ids.length?ids.map((id,n)=>keyHtml(Q[id],n)).join(''):`<div class="card empty">Không có câu nào khớp.</div>`;
}
function renderKey(){
 view='key';wakeSync();clearInterval(tick);scrollTo(0,0);
 app.innerHTML=`<div class="view">
 <div class="nav"><div class="row" style="gap:12px;justify-content:flex-start"><button class="btn ico noprint" id="kback" aria-label="Về trang chủ">${I.home}</button><div class="logo"><i>✓</i><span>Đáp án &amp; lời giải</span></div></div>${themeBtn()}</div>
 <div class="kview noprint">
  <input class="field" id="ksearch" type="search" placeholder="Tìm câu hỏi, công thức, từ khóa… (VD: oleum, H2SO4, thụ động)" value="${esc(keyQ)}" autocomplete="off">
  <div><div class="sec-t" style="margin:0 0 8px">Dạng câu hỏi</div><div class="chips types">${typeChips()}</div></div>
  <div><div class="sec-t" style="margin:0 0 8px">Chuyên đề</div><div class="chips">${lessonChips()}</div></div>
 </div>
 <div class="row" style="margin-bottom:6px"><span id="kcount"></span><button class="btn sm noprint" id="kprint">In / Lưu PDF</button></div>
 <div class="rv" id="kl"></div></div>`;
 bindTheme();bindFilters(renderKey);
 $('#kback').onclick=renderHome;
 $('#kprint').onclick=()=>print();
 $('#ksearch').oninput=e=>{keyQ=e.target.value;drawKeyList()};

}

/* ---------- SESSION ---------- */
function startSession(ids,mode,shufQ,shufA,time){
 const orig=[...ids];
 ids=shufQ?shuffle(ids):[...ids];
 const perms={},rec={};
 ids.forEach(id=>{perms[id]=(shufA&&Q[id].type==='mcq')?shuffle([0,1,2,3]):[0,1,2,3];rec[id]=newRec(Q[id])});
 S={ver:DATA_VER,mode,ids,orig,perms,rec,cur:0,start:Date.now(),deadline:(mode==='exam'&&time>0)?Date.now()+time*60000:0,done:false,time,shufQ,shufA};
 if(ST.autoFs)FS.enter();saveS();streak=0;Snd.start();renderQuiz();
}
function resumeTimer(){if(S.deadline&&Date.now()>=S.deadline){finish(true);return}renderQuiz()}
const curId=()=>S.ids[S.cur];

/* ---------- QUIZ ---------- */
function renderQuiz(){
 view='quiz';wakeSync();clearInterval(tick);
 const ex=S.mode==='exam';
 app.innerHTML=`<div class="view">
 <div class="qtop">
  <button class="btn ico" id="quit" aria-label="Thoát về trang chủ">${I.home}</button>
  <span class="badge hide-s ${ex?'exam':'prac'}">${ex?I.clock:I.bolt}${ex?'THI':'LUYỆN TẬP'}</span>
  <div class="prog"><div class="lbl"><span id="plbl"></span><span id="ppct"></span></div><div class="bar"><i id="pbar"></i></div></div>
  ${ex&&S.deadline?`<span class="badge timer" id="timer">${I.clock}<span id="tt">--:--</span></span>`:''}
  ${themeBtn()}
  <button class="btn sm ${ex?'pri':'lime'}" id="fin">${I.stop}<span class="lbl-s">${ex?(S.deadline?'Nộp bài sớm':'Nộp bài'):'Kết thúc'}</span></button>
 </div>
 <div class="qgrid">
  <section class="card qcard" id="card"></section>
  <aside class="card side"><h4>Danh sách câu</h4><div class="ng" id="ng"></div><div class="legend" id="lg"></div></aside>
 </div>
 <div class="qbar"><button class="btn" id="prev">${I.l} Câu trước</button><button class="btn pri" id="next">Câu sau ${I.r}</button></div>
 </div>`;
 bindTheme();
 $('#quit').onclick=()=>confirmBox('Thoát bài làm?','Tiến độ được lưu tự động, bạn có thể tiếp tục sau ở trang chủ.','Về trang chủ',()=>{saveS();renderHome()},'Ở lại');
 $('#fin').onclick=askFinish;
 $('#prev').onclick=()=>go(S.cur-1);$('#next').onclick=()=>S.cur>=S.ids.length-1?askFinish():go(S.cur+1);
 if(ex&&S.deadline){let lastS=-1;const upd=()=>{const left=(S.deadline-Date.now())/1000;const sc=Math.ceil(left);if(sc!==lastS){lastS=sc;if(sc===60||sc===30)Snd.beep2();else if(sc>0&&sc<=10)Snd.warn()}const t=$('#tt');if(t)t.textContent=fmt(left);$('#timer')?.classList.toggle('low',left<=60);if(left<=0){clearInterval(tick);finish(true)}};upd();tick=setInterval(upd,500)}
 drawCard('',true);drawSide();
}
function go(i){if(i<0||i>=S.ids.length)return;Snd.nav();const d=i>S.cur?'slide-r':'slide-l';S.cur=i;saveS();drawCard(d,true);drawSide();scrollTo({top:0,behavior:'smooth'})}
function drawSide(){
 const ex=S.mode==='exam';
 $('#ng').innerHTML=S.ids.map((id,i)=>{const r=S.rec[id];let c='nb';
  if(ex){if(isDone(S,id))c+=' ans';if(r.flag)c+=' fl'}else{const st=status(id);if(st!=='skip')c+=' '+st}
  if(i===S.cur)c+=' cur';return `<button class="${c}" data-i="${i}" aria-label="Câu ${i+1}">${i+1}</button>`}).join('');
 $$('#ng .nb').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $('#lg').innerHTML=ex?`<span><i style="background:var(--acc)"></i>Đã làm</span><span><i style="background:var(--warn)"></i>Cần xem lại</span><span><i></i>Chưa làm</span>`:`<span><i style="background:var(--ok)"></i>Đúng lần đầu</span><span><i style="background:var(--bad)"></i>Đã sai</span><span><i></i>Chưa làm</span>`;
 const d=doneCount(S),p=d/S.ids.length*100;
 $('#plbl').textContent=`Đã làm ${d}/${S.ids.length}`;$('#ppct').textContent=Math.round(p)+'%';$('#pbar').style.width=p+'%';
 $('#prev').disabled=S.cur===0;
 $('#next').innerHTML=S.cur>=S.ids.length-1?`${ex?'Nộp bài':'Hoàn thành'} ${I.ok}`:`Câu sau ${I.r}`;
}
const noteBox=q=>q.note?`<div class="note">${rt(q.note)}</div>`:'';

function mcqHtml(q,r,perm,ex,shakeOi,stagger,anim){
 const locked=!ex&&(r.solved||r.revealed);
 const opts=perm.map((oi,pos)=>{
  let c='opt',ic='',dis='';
  if(ex){if(r.pick===oi)c+=' sel'}
  else{
   if(locked){if(oi===q.a){c+=' ok';ic=I.ok}else if(r.tries.includes(oi)){c+=' bad';ic=I.x}else c+=' dim';dis='disabled'}
   else if(r.tries.includes(oi)){c+=' bad';ic=I.x;dis='disabled'}
  }
  if(shakeOi===oi)c+=' shake';
  return `<button class="${c}" style="--i:${pos}" data-o="${oi}" ${dis}><span class="k">${'ABCD'[pos]}</span><span class="t">${rt(q.o[oi])}</span><span class="s">${ic}</span></button>`}).join('');
 let fb='';
 if(!ex){
  const letter='ABCD'[perm.indexOf(q.a)];
  if(r.solved)fb=`<div class="fb ok"><b>${r.tries.length?`Đúng rồi! (sau ${r.tries.length+1} lần thử)`:'Chính xác!'}</b>Đáp án đúng: <b style="display:inline">${letter}</b>${noteBox(q)}</div>`;
  else if(r.revealed)fb=`<div class="fb info"><b>Đáp án đúng là ${letter}</b>${noteBox(q)}</div>`;
  else if(r.tries.length)fb=`<div class="fb bad"><b>Chưa đúng — thử chọn lại nhé!</b><button class="btn sm" id="reveal">${I.eye} Xem đáp án</button></div>`;
 }
 return `<div class="opts ${stagger?'in':''}">${opts}</div>${fb}`;
}
function tfHtml(q,r,ex){
 const done=!ex&&r.checked;
 const rows=q.s.map((s,i)=>{
  const p=r.pick[i];let c='tfrow';
  if(done)c+=p===s.v?' ok':' bad';
  const btn=(val,label)=>{let bc='tfb';if(p===val)bc+=' sel';
   if(done){bc=bc.replace(' sel','');if(s.v===val)bc+=' ok';else if(p===val)bc+=' bad';else bc+=' dim'}
   return `<button class="${bc}" data-i="${i}" data-v="${val?1:0}" aria-pressed="${p===val}" ${done?'disabled':''}>${label}</button>`};
  return `<div class="${c}"><span class="k">${'abcd'[i]}</span><div class="stx">${rt(s.t)}</div><div class="tfbtns">${btn(true,'Đúng')}${btn(false,'Sai')}</div>${done&&s.n?`<div class="tfnote">${rt(s.n)}</div>`:''}</div>`}).join('');
 let extra='';
 if(!ex){
  if(!r.checked)extra=`<div class="qactions"><span class="hint" style="margin:0">Chọn Đúng hoặc Sai cho cả 4 ý, rồi bấm Kiểm tra.</span><button class="btn pri" id="chk" ${r.pick.every(x=>x!==null)?'':'disabled'}>Kiểm tra đáp án</button></div>`;
  else{const n=tfCount(q,r.pick);extra=n===4?`<div class="fb ok"><b>Chính xác cả 4 ý!</b></div>`:`<div class="fb info"><b>Đúng ${n}/4 ý</b>Xem lời giải từng ý ở trên.</div>`}
 }
 return `<div class="tfrows">${rows}</div>${extra}`;
}
function shortHtml(q,r,ex,shake){
 const locked=!ex&&(r.solved||r.revealed);
 const hint=q.kind==='digits'?'Nhập các chữ số liền nhau, theo thứ tự tăng dần (ví dụ: 134).':'Nhập đáp số (dấu thập phân là dấu phẩy hoặc dấu chấm).';
 let fb='';
 if(!ex){
  const a=`<div class="ansline">Đáp án: <b>${esc(ansText(q))}</b>${q.unit?` ${rt(q.unit)}`:''}</div>`;
  if(r.solved)fb=`<div class="fb ok"><b>${r.tries.length?`Đúng rồi! (sau ${r.tries.length+1} lần thử)`:'Chính xác!'}</b>${a}${noteBox(q)}</div>`;
  else if(r.revealed)fb=`<div class="fb info"><b>Đáp án của câu này</b>${a}${noteBox(q)}</div>`;
  else if(r.tries.length)fb=`<div class="fb bad"><b>Chưa đúng — kiểm tra lại nhé!</b><button class="btn sm" id="reveal">${I.eye} Xem đáp án</button></div>`;
 }
 return `<div class="shortrow"><input id="sa" class="sa ${shake?'shake':''}" type="text" inputmode="${q.kind==='digits'?'numeric':'decimal'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${q.kind==='digits'?'VD: 134':'Đáp số'}" aria-label="Câu trả lời" value="${esc(r.val)}" ${locked?'disabled':''}>${q.unit?`<span class="unit">${rt(q.unit)}</span>`:''}${!ex&&!locked?`<button class="btn pri" id="chk">Kiểm tra</button>`:''}</div><div class="hint">${hint}</div>${fb}`;
}
function drawCard(anim,stagger,shakeOi=null){
 const id=curId(),q=Q[id],r=S.rec[id],perm=S.perms[id],ex=S.mode==='exam';
 let body='';
 if(q.type==='mcq')body=mcqHtml(q,r,perm,ex,shakeOi,stagger,anim);
 else if(q.type==='tf')body=tfHtml(q,r,ex);
 else body=shortHtml(q,r,ex,shakeOi);
 const actions=ex?`<div class="qactions"><button class="btn sm flag ${r.flag?'on':''}" id="flag">${I.flag} ${r.flag?'Đã đánh dấu xem lại':'Đánh dấu xem lại'}</button><button class="btn sm" id="clr" ${isDone(S,id)?'':'disabled'}>Bỏ chọn</button></div>`:'';
 $('#card').className='card qcard '+anim;
 $('#card').innerHTML=`<div class="qmeta"><span class="qn">Câu ${S.cur+1}<span style="opacity:.6;font-weight:600">/${S.ids.length}</span></span><span class="tt ${q.type}">${TYPES[q.type]}</span><span class="lesson">${esc(q.lesson)}${q.src?` · ${esc(q.src)}`:''}</span></div>
  <div class="qtext">${rt(q.q)}</div>${body}${actions}`;
 $$('#card .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
 $$('#card .tfb').forEach(b=>b.onclick=()=>pickTF(+b.dataset.i,b.dataset.v==='1'));
 const sa=$('#sa');
 if(sa&&!sa.disabled){
  sa.oninput=()=>{r.val=sa.value;if(ex){saveS();drawSide();const c=$('#clr');if(c)c.disabled=sa.value.trim()===''}};
  sa.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(ex){if(S.cur<S.ids.length-1)go(S.cur+1)}else checkShort()}};
  if(shakeOi||matchMedia('(pointer:fine)').matches)sa.focus({preventScroll:true});
  if(shakeOi)sa.select();
 }
 $('#chk')?.addEventListener('click',()=>q.type==='tf'?checkTF():checkShort());
 $('#reveal')?.addEventListener('click',()=>{Snd.reveal();r.revealed=true;saveS();drawCard('');drawSide()});
 $('#flag')?.addEventListener('click',()=>{Snd.flag();r.flag=!r.flag;saveS();drawCard('');drawSide()});
 $('#clr')?.addEventListener('click',()=>{Snd.pop();
  if(q.type==='mcq')r.pick=null;else if(q.type==='tf')r.pick=[null,null,null,null];else r.val='';
  saveS();drawCard('');drawSide()});
}
function pick(oi){
 const id=curId(),q=Q[id],r=S.rec[id];
 if(q.type!=='mcq')return;
 if(S.mode==='exam'){Snd.pop();r.pick=(r.pick===oi)?null:oi;saveS();drawCard('');drawSide();return}
 if(r.solved||r.revealed||r.tries.includes(oi))return;
 if(oi===q.a){streak=r.tries.length?0:streak+1;Snd.correct(streak-1<0?0:streak-1);r.solved=true;saveS();drawCard('');drawSide()}
 else{streak=0;Snd.wrong();r.tries.push(oi);saveS();drawCard('',false,oi);drawSide()}
}
function pickTF(i,v){
 const id=curId(),q=Q[id],r=S.rec[id];
 if(q.type!=='tf'||(S.mode!=='exam'&&r.checked))return;
 Snd.pop();r.pick[i]=(r.pick[i]===v)?null:v;saveS();drawCard('');drawSide();
}
function checkTF(){
 const id=curId(),q=Q[id],r=S.rec[id];
 if(r.checked||!r.pick.every(x=>x!==null))return;
 r.checked=true;
 if(tfCount(q,r.pick)===4){streak++;Snd.correct(Math.max(0,streak-1))}else{streak=0;Snd.wrong()}
 saveS();drawCard('');drawSide();
}
function checkShort(){
 const id=curId(),q=Q[id],r=S.rec[id];
 if(r.solved||r.revealed)return;
 const v=String(r.val).trim();
 if(!v){Snd.warn();$('#sa')?.focus();return}
 if(shortRight(q,v)){streak=r.tries.length?0:streak+1;Snd.correct(Math.max(0,streak-1));r.solved=true;saveS();drawCard('');drawSide()}
 else{streak=0;Snd.wrong();r.tries.push(v);saveS();drawCard('',false,true);drawSide()}
}
function askFinish(){
 const left=S.ids.length-doneCount(S),fl=S.ids.filter(id=>S.rec[id].flag).length;
 let msg=left?`Bạn còn <b>${left}</b> câu chưa làm${fl?` và <b>${fl}</b> câu đã đánh dấu xem lại`:''}.`:(fl?`Bạn còn <b>${fl}</b> câu đã đánh dấu xem lại.`:'Bạn đã làm hết các câu.');
 const early=S.mode==='exam'&&S.deadline?` Bạn có thể nộp sớm, còn lại <b>${fmt((S.deadline-Date.now())/1000)}</b>.`:'';
 confirmBox(S.mode==='exam'?(early?'Nộp bài sớm?':'Nộp bài thi?'):'Kết thúc luyện tập?',msg+early+(S.mode==='exam'?' Sau khi nộp sẽ không sửa được.':''),S.mode==='exam'?'Nộp bài':'Xem kết quả',()=>finish(false));
}
function finish(auto){
 clearInterval(tick);if(auto)Snd.timeup();else Snd.submit();S.done=true;S.end=Date.now();store.del('hh_sess');
 const h=store.get('hh_hist',{best:null,exams:0,practices:0});
 if(S.mode==='exam'){h.exams++;const sc=S.ids.reduce((a,id)=>a+qScore(id),0)/S.ids.length*10;if(h.best===null||sc>h.best)h.best=Math.round(sc*100)/100}else h.practices++;
 store.set('hh_hist',h);
 renderResult(auto);
}

/* ---------- RESULT ---------- */
let rvFilter='all';
function renderResult(auto){
 view='result';wakeSync();rvFilter='all';scrollTo(0,0);
 const ex=S.mode==='exam',T=S.ids.length;
 const st=S.ids.map(id=>status(id));
 const ok=st.filter(x=>x==='ok').length,bad=st.filter(x=>x==='bad').length,skip=st.filter(x=>x==='skip').length;
 const sum=ex?S.ids.reduce((a,id)=>a+qScore(id),0):ok;
 const pct=Math.round(sum/T*100),wrongIds=S.ids.filter((id,i)=>st[i]!=='ok');
 const score=fmtScore(sum/T*10);
 const msg=pct===100?['Tuyệt đối!','Không sai câu nào — quá đỉnh!']:pct>=80?['Xuất sắc!','Chỉ cần ôn thêm vài câu nữa là hoàn hảo.']:pct>=50?['Khá tốt!','Xem lại các câu sai rồi làm lại để chắc hơn nhé.']:['Cố lên nào!','Đừng lo, ôn lại lời giải rồi thử lại các câu sai.'];
 const dur=fmt(((S.end||Date.now())-S.start)/1000);
 app.innerHTML=`<div class="view">
 <div class="nav"><div class="logo"><i>H<sub>2</sub></i><span>Kết quả ${ex?'bài thi':'luyện tập'}</span></div>${themeBtn()}</div>
 <section class="card rhero">
  <div class="ring"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="88"/><circle class="pg" id="pg" cx="100" cy="100" r="88"/></svg>
   <div class="c"><b id="sc">0</b><span>${ex?'ĐIỂM /10':'ĐÚNG LẦN ĐẦU'}</span></div></div>
  <div><h2>${auto?'Hết giờ! ':''}${msg[0]}</h2><p class="lead">${msg[1]}</p>
   <div class="kp"><div class="g"><b>${ok}</b><small>${ex?'Đúng':'Đúng lần đầu'}</small></div><div class="r"><b>${bad}</b><small>${ex?'Sai / thiếu':'Từng sai'}</small></div><div class="y"><b>${skip}</b><small>Bỏ trống</small></div><div><b class="mono" style="font-size:1.25rem">${dur}</b><small>Thời gian</small></div></div></div>
 </section>
 <section class="card again">
  ${wrongIds.length?`<div><b style="font-family:var(--f-head);font-size:1.25rem">Làm lại ${wrongIds.length} câu chưa đúng</b><p class="lead" style="margin-top:2px">Chọn cách xáo rồi bắt đầu lại — chỉ gồm các câu sai và bỏ trống.</p></div>
  <div class="switches">
   <button class="sw" role="switch" aria-checked="${cfg.shufQ}" data-sw="shufQ"><span><b>${I.shuf}Xáo thứ tự câu</b></span><span class="tg"></span></button>
   <button class="sw" role="switch" aria-checked="${cfg.shufA}" data-sw="shufA"><span><b>${I.dice}Xáo đáp án</b></span><span class="tg"></span></button></div>
  <div class="btns"><button class="btn lime" id="rp">${I.bolt} Luyện lại câu sai</button><button class="btn pri" id="re">${I.clock} Thi lại câu sai</button></div>`:`<div><b style="font-family:var(--f-head);font-size:1.25rem">Không còn câu sai nào</b></div>`}
  <div class="btns"><button class="btn" id="all">${I.redo} Làm lại toàn bộ đề</button><button class="btn" id="home">${I.home} Trang chủ</button></div>
 </section>
 <div class="row"><div class="sec-t" style="margin:0">Xem lại bài làm</div>
  <div class="seg" id="seg"><button data-f="all" class="on">Tất cả (${T})</button><button data-f="wrong">Câu sai (${wrongIds.length})</button><button data-f="ok">Câu đúng (${ok})</button></div></div>
 <div class="rv" id="rv"></div>
 </div>`;
 bindTheme();drawReview();
 $$('#seg button').forEach(b=>b.onclick=()=>{rvFilter=b.dataset.f;$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));drawReview()});
 $$('[data-sw]').forEach(b=>b.onclick=()=>{const k=b.dataset.sw;cfg[k]=!cfg[k];saveCfg();b.setAttribute('aria-checked',cfg[k])});
 const t=ex?(S.time||0):0;
 $('#rp')?.addEventListener('click',()=>startSession(wrongIds,'practice',cfg.shufQ,cfg.shufA,0));
 $('#re')?.addEventListener('click',()=>startSession(wrongIds,'exam',cfg.shufQ,cfg.shufA,0));
 $('#all').onclick=()=>startSession(S.orig||S.ids,S.mode,cfg.shufQ,cfg.shufA,t);
 $('#home').onclick=renderHome;
 requestAnimationFrame(()=>setTimeout(()=>{$('#pg').style.strokeDashoffset=553*(1-pct/100);
  const target=ex?sum/T*10:ok,t0=performance.now();
  const step=n=>{const k=Math.min(1,(n-t0)/1300),e=1-Math.pow(1-k,3);$('#sc').textContent=ex?fmtScore(target*e):String(Math.round(target*e));if(k<1)requestAnimationFrame(step);else $('#sc').textContent=ex?score:String(ok)};
  requestAnimationFrame(step)},80));
 setTimeout(()=>Snd.result(pct),auto?1000:550);
 if(pct>=80)setTimeout(confetti,600);
}
function reviewBody(id){
 const q=Q[id],r=S.rec[id],perm=S.perms[id],ex=S.mode==='exam';
 if(q.type==='mcq'){
  const wrongPicks=ex?(r.pick!==null&&r.pick!==q.a?[r.pick]:[]):r.tries;
  return `<div class="opts">${perm.map((oi,pos)=>{
   let c='opt',ic='',tag='';
   if(oi===q.a){c+=' ok';ic=I.ok}else if(wrongPicks.includes(oi)){c+=' bad';ic=I.x;tag=' <small>(bạn đã chọn)</small>'}else c+=' dim';
   return `<div class="${c}"><span class="k">${'ABCD'[pos]}</span><span class="t">${rt(q.o[oi])}${tag}</span><span class="s">${ic}</span></div>`}).join('')}</div>`+(q.note?`<div class="fb info"><div class="note" style="margin:0">${rt(q.note)}</div></div>`:'');
 }
 if(q.type==='tf'){
  const answered=ex?isDone(S,id):r.checked;
  return `<div class="tfrows">${q.s.map((s,i)=>{
   const p=r.pick[i];const good=answered&&p===s.v;
   const you=!answered?'<small>(bạn chưa làm)</small>':p===null?'<small>(bạn bỏ trống)</small>':`<small>(bạn chọn ${p?'Đúng':'Sai'})</small>`;
   return `<div class="tfrow static ${answered?(good?'ok':'bad'):''}"><span class="k">${'abcd'[i]}</span><div class="stx"><span class="vb ${s.v?'t':'f'}">${s.v?'ĐÚNG':'SAI'}</span>${rt(s.t)} ${you}</div>${s.n?`<div class="tfnote">${rt(s.n)}</div>`:''}</div>`}).join('')}</div>`
   +(answered?`<div class="hint">Đúng ${tfCount(q,r.pick)}/4 ý${ex?` · được ${fmtScore(TFSCORE[tfCount(q,r.pick)])} điểm của câu`:''}.</div>`:'');
 }
 const given=ex?String(r.val).trim():(r.tries.length?r.tries[r.tries.length-1]:(r.solved?String(r.val).trim():''));
 const right=ex?shortRight(q,r.val):r.solved&&!r.tries.length;
 const tries=!ex&&r.tries.length?`<small>Các đáp án bạn đã thử: ${r.tries.map(t=>esc(t)).join(' · ')}</small>`:'';
 return `<div class="shortbox ${isDone(S,id)||r.tries&&r.tries.length?(right?'ok':'bad'):''}"><small>Bạn trả lời</small><b>${given?esc(given):'(bỏ trống)'}</b>${tries}</div>
  <div class="shortbox ok"><small>Đáp án đúng</small><b>${esc(ansText(q))}</b>${q.unit?` <span class="unit">${rt(q.unit)}</span>`:''}</div>
  <div class="fb info"><div class="note" style="margin:0">${rt(q.note)}</div></div>`;
}
function drawReview(){
 const list=S.ids.map((id,i)=>({id,i,s:status(id)})).filter(x=>rvFilter==='all'||(rvFilter==='ok'?x.s==='ok':x.s!=='ok'));
 const ex=S.mode==='exam';
 $('#rv').innerHTML=list.length?list.map((x,n)=>{
  const q=Q[x.id],r=S.rec[x.id];
  const lab={ok:ex?'ĐÚNG':'ĐÚNG LẦN ĐẦU',bad:ex?'SAI':'TỪNG SAI',skip:'BỎ TRỐNG'}[x.s],cl={ok:'ok',bad:'bad',skip:'skip'}[x.s];
  return `<article class="card rvi" style="--i:${Math.min(n,12)}"><div class="qmeta"><span class="qn">Câu ${x.i+1}</span><span class="st ${cl}">${lab}</span><span class="tt ${q.type}">${TYPES[q.type]}</span>${r.flag?`<span class="st skip">${I.flag} đã đánh dấu</span>`:''}<span class="lesson">${esc(q.lesson)}</span></div>
  <div class="qtext">${rt(q.q)}</div>${reviewBody(x.id)}</article>`}).join(''):`<div class="card empty">Không có câu nào trong mục này.</div>`;
}

/* ---------- KEYBOARD ---------- */
addEventListener('keydown',e=>{
 const inField=/INPUT|TEXTAREA/.test(e.target.tagName);
 if(e.key&&e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&FS.supported&&!$('#ov')&&!inField){FS.toggle();return}
 if(view!=='quiz'||!S||$('#ov')||e.ctrlKey||e.metaKey||e.altKey||inField)return;
 const k=e.key.toLowerCase();
 if(Q[curId()].type==='mcq'){
  const i='1234'.indexOf(k)>=0&&k.length==1?'1234'.indexOf(k):'abcd'.indexOf(k);
  if(k.length===1&&i>=0){pick(S.perms[curId()][i]);return}
 }
 if(k==='arrowright'||k==='enter'&&!e.target.closest('button')){if(S.cur<S.ids.length-1)go(S.cur+1)}
 else if(k==='arrowleft')go(S.cur-1);
});

/* ---------- INIT ---------- */
document.addEventListener('pointerdown',()=>Snd.unlock(),{once:true});
document.addEventListener('keydown',()=>Snd.unlock(),{once:true});
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.chip,.mode,.sw,.seg button');if(b&&!b.closest('.opt')&&b.id!=='next'&&b.id!=='prev'&&!b.closest('#setpop'))Snd.tick()});
renderHome();
setTimeout(showFsIntro,600);
</script>
</body>
</html>
